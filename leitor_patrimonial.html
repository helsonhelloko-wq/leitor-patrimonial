<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leitor Patrimonial</title>
  <script src="https://unpkg.com/@zxing/browser@0.2.1"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f1f3f4;font-family:Arial,Helvetica,sans-serif;color:#202124}
    .container{width:100%;max-width:620px;margin:auto;padding:18px}
    .card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
    h1{font-size:23px;margin:0 0 6px;text-align:center}
    p{text-align:center;color:#666}
    .camera{position:relative;background:#000;border-radius:12px;overflow:hidden;margin:18px 0}
    video{display:block;width:100%;height:auto;min-height:260px;object-fit:cover}
    .mira{position:absolute;left:8%;right:8%;top:50%;height:3px;background:#ff0000;box-shadow:0 0 8px rgba(255,0,0,.8)}
    .status{text-align:center;font-weight:bold;margin:14px 0}
    button{width:100%;border:0;border-radius:9px;padding:15px;margin-top:10px;font-size:16px;font-weight:bold;cursor:pointer}
    .fechar{background:#d93025;color:#fff}
    .manual{background:#1a73e8;color:#fff}
    .codigo{font-size:22px;text-align:center;font-weight:bold;letter-spacing:2px;word-break:break-all}
    .erro{color:#b3261e;text-align:center}
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>📷 Leitor Patrimonial</h1>
    <p>Aponte a câmera para o código de barras <strong>Code 128</strong>.</p>

    <div class="camera">
      <video id="video" autoplay muted playsinline></video>
      <div class="mira"></div>
    </div>

    <div id="status" class="status">Iniciando câmera...</div>

    <div id="codigoBox" style="display:none">
      <div id="codigo" class="codigo"></div>
    </div>

    <button class="fechar" onclick="fechar()">✖ FECHAR</button>
    <button class="manual" onclick="voltarComCodigo()">↩ VOLTAR SEM NOVA LEITURA</button>
  </div>
</div>

<script>
let reader = null;
let controls = null;
let lendo = false;

const retorno = new URLSearchParams(location.search).get('retorno');

async function iniciar() {
  const status = document.getElementById('status');

  try {
    reader = new ZXingBrowser.BrowserMultiFormatReader();

    const devices = await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();

    if (!devices.length) throw new Error('Nenhuma câmera foi encontrada.');

    let camera = devices.find(d =>
      /back|rear|environment|traseira/i.test(d.label)
    ) || devices[0];

    lendo = true;
    status.textContent = 'Aponte a câmera para o código...';

    controls = await reader.decodeFromVideoDevice(
      camera.deviceId,
      document.getElementById('video'),
      (result) => {
        if (!result || !lendo) return;

        const codigo = String(result.getText() || '').replace(/\D/g, '');

        if (codigo.length !== 16) {
          status.textContent = 'Código lido, mas não possui 16 dígitos.';
          return;
        }

        lendo = false;
        status.textContent = 'Código identificado!';
        document.getElementById('codigo').textContent = codigo;
        document.getElementById('codigoBox').style.display = 'block';

        pararCamera();

        setTimeout(() => {
          retornar(codigo);
        }, 400);
      }
    );
  } catch (e) {
    console.error(e);
    status.innerHTML = '<span class="erro">' +
      (e && e.message ? e.message : 'Não foi possível acessar a câmera.') +
      '</span>';
  }
}

function pararCamera() {
  lendo = false;
  if (controls) {
    try { controls.stop(); } catch(e) {}
    controls = null;
  }
  if (reader) {
    try { reader.reset(); } catch(e) {}
  }
  const video = document.getElementById('video');
  if (video && video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  }
}

function retornar(codigo) {
  if (!retorno) {
    document.getElementById('status').textContent =
      'Código: ' + codigo + '. Nenhum endereço de retorno foi informado.';
    return;
  }

  const url = new URL(retorno);
  url.searchParams.set('codigo', codigo);
  window.location.href = url.toString();
}

function voltarComCodigo() {
  pararCamera();
  if (retorno) window.location.href = retorno;
  else window.close();
}

function fechar() {
  pararCamera();
  if (retorno) window.location.href = retorno;
  else window.close();
}

window.addEventListener('load', iniciar);
window.addEventListener('beforeunload', pararCamera);
</script>
</body>
</html>
